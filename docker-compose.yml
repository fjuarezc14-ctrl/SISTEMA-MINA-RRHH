services:
  # Base de Datos Relacional PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: mina_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-valetec_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-valetec_secure_pass}
      POSTGRES_DB: ${DB_NAME:-mina_onboarding_db}
    ports:
      # Restringido estrictamente a localhost para evitar exposición a la red local/WiFi
      - "127.0.0.1:5450:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./backend/src/database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
      - ./database/migration_v3_emergencias_y_seguros.sql:/docker-entrypoint-initdb.d/03-migration_v3.sql
      - ./database/migration_v4_seguridad.sql:/docker-entrypoint-initdb.d/04-migration_v4.sql
    networks:
      - valetec-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-valetec_admin} -d ${DB_NAME:-mina_onboarding_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Backend API (Node.js + Express + TypeScript)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mina_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: ${PORT:-4050}
      NODE_ENV: ${NODE_ENV:-development}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-valetec_admin}
      DB_PASSWORD: ${DB_PASSWORD:-valetec_secure_pass}
      DB_NAME: ${DB_NAME:-mina_onboarding_db}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      UPLOAD_DIR: ${UPLOAD_DIR:-./uploads}
    ports:
      - "4050:4050"
    volumes:
      - backend_uploads:/app/uploads
    networks:
      - valetec-network

  # Frontend SPA (React + Vite + Tailwind + Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:4050/api}
    container_name: mina_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5150:80"
    networks:
      - valetec-network

volumes:
  postgres_data:
    driver: local
  backend_uploads:
    driver: local

networks:
  valetec-network:
    driver: bridge
